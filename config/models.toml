# Modellkandidaten für den Benchmark (ADR 0004). IDs exakt wie im FHNW-LiteLLM-Dropdown.
# structured_output: "function_calling" oder "json_schema"; mit `uv run ea-check-models` prüfen und hier setzen.
# Preise (USD pro 1 Mio. Tokens): FHNW-LiteLLM, abgefragt über /model/info am 06.10.2026 (input_cost_per_token,
# output_cost_per_token). Die OpenRouter-Schätzung vom selben Tag lag bei gpt-oss-120b um Faktor 4–5 zu tief.

[[models]]
id = "gpt-5.6-luna"
label = "GPT-5.6 Luna"
role = "Arbeitsmodell, proprietär, günstig (OpenAI, 9.7.2026)"
structured_output = "function_calling"  # ea-check-models 06.10.2026: function_calling ok, json_schema ok
reasoning_effort = "low"
usd_per_mtok_input = 0.20
usd_per_mtok_output = 1.20

[[models]]
id = "azure_ai/gpt-oss-120b"
label = "gpt-oss-120b"
role = "offenes Modell, Apache 2.0 (OpenAI, 5.8.2025)"
structured_output = "json_schema"  # ea-check-models 06.10.2026: function_calling liefert leere Ausgabe, json_schema ok
usd_per_mtok_input = 0.15  # OpenRouter-Schätzung war 0.03 / 0.17
usd_per_mtok_output = 0.60

[[models]]
id = "azure_ai/mistral-large-3"
label = "Mistral Large 3"
role = "offenes Modell, Apache 2.0, andere Modellfamilie, EU-Anbieter (Mistral, 2.12.2025)"
structured_output = "json_schema"  # ea-check-models 06.10.2026: function_calling 422 (Azure), json_schema ok
usd_per_mtok_input = 0.50
usd_per_mtok_output = 1.50

# Nicht im Benchmark (Begründung in ADR 0004):
# azure_ai/gpt-5.4-mini            ältere, kleinere Schwester von Luna (17.3.2026); FHNW 0.75 / 4.50
# azure_ai/kimi-k2.7-code          auf Coding spezialisiert (Juni 2026); FHNW 0.95 / 4.00
